# Har 30 daqiqada: narxlar, yangiliklar, ta'sir bahosi, prognozlar -> `data` shoxchasi.
# Sayt (Vercel) shu shoxchadagi JSON fayllarni o'qiydi, shuning uchun server kerak emas.
name: Ma'lumotni yangilash
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
concurrency: { group: atlas-data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: data, path: state, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-finbert-v1 }
      - name: Yangilash
        run: python -m atlas.cli cloud-update
        env: { ATLAS_DATA: state }
      - name: data shoxchasiga yozish (tarixsiz bitta commit — repo shishmaydi)
        run: |
          cd state
          git config user.name "atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan snapshot
          git add -A
          git commit -qm "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf origin snapshot:data
